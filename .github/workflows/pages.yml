name: Deploy GitHub Pages

# Publish the playable backyard build, never the main stub.
on:
  push:
    branches: [cursor/mota-mayhem-backyard-4632]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  enable-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Prefer legacy Pages from gh-pages (sibling pattern)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=legacy \
            -f source[branch]=gh-pages \
            -f source[path]=/ 
          status=$?
          if [ "$status" -ne 0 ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/ || true
          fi

  deploy:
    needs: enable-branch
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
